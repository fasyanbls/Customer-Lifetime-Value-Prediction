<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLV Analytics — {% block title %}Dashboard{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
:root {
  --cream:      #F5EFE0;
  --cream-dark: #EDE3CE;
  --brown-light:#C4956A;
  --brown-mid:  #8B6F4E;
  --brown-dark: #5C3D2E;
  --ink:        #3d2b1f;
  --ink-light:  #7a5c47;
  --white-warm: #FBF7F0;
  --red-warm:   #8B3A3A;
  --shadow:     rgba(92,61,46,0.12);
  --radius:     10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--cream);
  color: var(--ink);
  font-family: 'Lato', sans-serif;
  font-weight: 400;
  line-height: 1.7;
  min-height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
  position: fixed; top: 0; left: 0;
  width: 240px; height: 100vh;
  background: var(--brown-dark);
  display: flex; flex-direction: column;
  padding: 0;
  z-index: 100;
  box-shadow: 2px 0 16px var(--shadow);
}

.sidebar-brand {
  padding: 28px 24px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.sidebar-brand h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--cream);
  line-height: 1.3;
}
.sidebar-brand p {
  font-size: 0.72rem;
  color: var(--brown-light);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 4px;
}

.sidebar nav {
  padding: 20px 0;
  flex: 1;
}
.nav-link {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 24px;
  color: rgba(245,239,224,0.72);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 400;
  letter-spacing: 0.02em;
  transition: all 0.2s;
  border-left: 3px solid transparent;
}
.nav-link:hover, .nav-link.active {
  color: var(--cream);
  background: rgba(255,255,255,0.07);
  border-left-color: var(--brown-light);
}
.nav-icon { font-size: 16px; width: 20px; text-align: center; }

.sidebar-footer {
  padding: 16px 24px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-size: 0.72rem;
  color: rgba(245,239,224,0.4);
}

/* ── Main content ── */
.main {
  margin-left: 240px;
  min-height: 100vh;
  padding: 32px 36px;
}

.page-header {
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--cream-dark);
}
.page-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 600;
  color: var(--brown-dark);
}
.page-header p {
  color: var(--ink-light);
  font-size: 0.9rem;
  margin-top: 4px;
}

/* ── KPI Cards ── */
.kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 28px; }
.kpi-card {
  background: var(--white-warm);
  border: 1px solid var(--cream-dark);
  border-radius: var(--radius);
  padding: 20px 22px;
  position: relative;
  overflow: hidden;
}
.kpi-card::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 4px; height: 100%;
  background: var(--brown-mid);
}
.kpi-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-light); margin-bottom: 6px; }
.kpi-value { font-family: 'Playfair Display', serif; font-size: 1.9rem; font-weight: 600; color: var(--brown-dark); }
.kpi-sub   { font-size: 0.78rem; color: var(--ink-light); margin-top: 2px; }

/* ── Chart cards ── */
.chart-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; margin-bottom: 24px; }
.chart-card {
  background: var(--white-warm);
  border: 1px solid var(--cream-dark);
  border-radius: var(--radius);
  padding: 20px;
}
.chart-card.full { grid-column: 1 / -1; }
.chart-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  color: var(--brown-dark);
  margin-bottom: 12px;
  font-weight: 600;
}

/* ── Table ── */
.table-card {
  background: var(--white-warm);
  border: 1px solid var(--cream-dark);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 24px;
}
.table-card .chart-title { padding: 18px 20px 0; }
table { width: 100%; border-collapse: collapse; }
th {
  background: var(--cream-dark);
  padding: 10px 16px;
  text-align: left;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  font-weight: 600;
}
td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--cream-dark);
  font-size: 0.88rem;
  color: var(--ink);
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--cream); }

/* ── Badges ── */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.05em;
}
.badge-high   { background: #f0d8d8; color: #8B3A3A; }
.badge-medium { background: #f0e6d0; color: #8B6F4E; }
.badge-low    { background: #e8e8d8; color: #6a6a40; }

/* ── Buttons ── */
.btn {
  display: inline-block;
  padding: 10px 22px;
  border-radius: 6px;
  font-family: 'Lato', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  text-decoration: none;
}
.btn-primary {
  background: var(--brown-dark);
  color: var(--cream);
}
.btn-primary:hover { background: #4a2e22; transform: translateY(-1px); box-shadow: 0 4px 12px var(--shadow); }
.btn-secondary {
  background: var(--cream-dark);
  color: var(--ink);
  border: 1px solid var(--brown-light);
}

/* ── Forms ── */
.form-card {
  background: var(--white-warm);
  border: 1px solid var(--cream-dark);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 24px;
}
.form-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 20px; }
.form-group label {
  display: block;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  margin-bottom: 6px;
  font-weight: 600;
}
.form-group input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--brown-light);
  border-radius: 6px;
  background: var(--cream);
  color: var(--ink);
  font-family: 'Lato', sans-serif;
  font-size: 0.9rem;
  transition: border-color 0.2s;
}
.form-group input:focus {
  outline: none;
  border-color: var(--brown-dark);
  background: var(--white-warm);
}

/* ── Alert/Result ── */
.alert {
  padding: 14px 20px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 0.9rem;
}
.alert-success { background: #e8f0e0; border-left: 4px solid #5a7a3a; color: #3d5a25; }
.alert-error   { background: #f0e0e0; border-left: 4px solid var(--red-warm); color: var(--red-warm); }
.alert-info    { background: #e8dfd0; border-left: 4px solid var(--brown-mid); color: var(--brown-dark); }

/* ── Result box ── */
.metrics-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.metric-item {
  background: var(--cream);
  border: 1px solid var(--cream-dark);
  border-radius: 8px;
  padding: 14px 16px;
  text-align: center;
}
.metric-value { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--brown-dark); }
.metric-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-light); margin-top: 4px; }

.prediction-result {
  background: var(--white-warm);
  border: 2px solid var(--brown-mid);
  border-radius: var(--radius);
  padding: 28px;
  text-align: center;
  margin-top: 20px;
}
.prediction-result .clv-amount {
  font-family: 'Playfair Display', serif;
  font-size: 3rem;
  color: var(--brown-dark);
  font-weight: 700;
}
.prediction-result .clv-label { color: var(--ink-light); font-size: 0.9rem; margin-bottom: 8px; }

/* ── Table card header ── */
.table-card-header { padding: 18px 20px 0; }

/* ── Empty row ── */
.empty-row { text-align: center; color: var(--ink-light); padding: 24px !important; }

/* ── Notes cell ── */
.notes-cell { font-size: 0.8rem; color: var(--ink-light); }

/* ── Section title spacing ── */
.section-title { margin-bottom: 16px; }

/* ── Action grid (ETL page) ── */
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.action-box {
  background: var(--cream);
  border: 1px solid var(--cream-dark);
  border-radius: 8px;
  padding: 20px;
}
.action-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  color: var(--brown-dark);
  margin-bottom: 8px;
}
.action-desc {
  font-size: 0.85rem;
  color: var(--ink-light);
  margin-bottom: 16px;
}

/* ── ETL Steps grid ── */
.steps-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
}
.step-box {
  padding: 16px;
}
.step-box--border {
  border-right: 1px solid var(--cream-dark);
}
.step-number {
  font-size: 1.8rem;
  font-family: 'Playfair Display', serif;
  color: var(--brown-light);
  margin-bottom: 8px;
}
.step-name {
  font-weight: 600;
  color: var(--brown-dark);
  margin-bottom: 6px;
}
.step-desc {
  font-size: 0.83rem;
  color: var(--ink-light);
}

/* ── Two-column grid (model page) ── */
.two-col-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

/* ── Info table (model architecture) ── */
.info-table { font-size: 0.82rem; width: 100%; }
.info-table td { padding: 4px 0; border: none; }
.info-label { color: var(--ink-light); padding-right: 8px !important; }

/* ── Metrics grid with margin ── */
.metrics-grid--mb { margin-bottom: 24px; }

/* ── Chart card with margin ── */
.chart-card--mb { margin-bottom: 24px; }

/* ── Prediction page ── */
.predict-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}
.predict-result {
  background: var(--white-warm);
  border: 2px solid var(--brown-mid);
  border-radius: var(--radius);
  padding: 28px;
  text-align: center;
  margin-top: 20px;
}
.predict-result .clv-amount {
  font-family: 'Playfair Display', serif;
  font-size: 3rem;
  color: var(--brown-dark);
  font-weight: 700;
}
.predict-result .clv-label {
  color: var(--ink-light);
  font-size: 0.9rem;
  margin-bottom: 8px;
}
.predict-result .clv-advice {
  margin-top: 16px;
  font-size: 0.85rem;
  color: var(--ink-light);
}
.reference-table td {
  font-size: 0.85rem;
}
.section-mb { margin-bottom: 24px; }
.two-col-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.info-table { font-size: 0.82rem; width: 100%; border-collapse: collapse; }
.info-table td { padding: 5px 0; border: none; }
.info-label { color: var(--ink-light); padding-right: 12px !important; width: 140px; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.action-box { background: var(--cream); border: 1px solid var(--cream-dark); border-radius: 8px; padding: 20px; }
.action-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--brown-dark); margin-bottom: 8px; font-weight: 600; }
.action-desc { font-size: 0.85rem; color: var(--ink-light); margin-bottom: 16px; line-height: 1.6; }
.steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.step-box { padding: 16px; }
.step-box--border { border-right: 1px solid var(--cream-dark); }
.step-number { font-size: 1.8rem; font-family: 'Playfair Display', serif; color: var(--brown-light); margin-bottom: 8px; }
.step-name { font-weight: 600; color: var(--brown-dark); margin-bottom: 6px; font-size: 0.95rem; }
.step-desc { font-size: 0.83rem; color: var(--ink-light); line-height: 1.6; }
.metrics-grid--mb { margin-bottom: 24px; }
.chart-card--mb { margin-bottom: 24px; }
.table-card-header { padding: 18px 20px 0; }
.empty-row { text-align: center; color: var(--ink-light); padding: 24px !important; }
.notes-cell { font-size: 0.8rem; color: var(--ink-light); }
.section-title { margin-bottom: 16px; }

/* ═══════════════════════════════════════════════════
   PASTE THIS ENTIRE BLOCK at the bottom of the
   existing <style> tag inside base.html,
   right before the @media query
   ═══════════════════════════════════════════════════ */

/* ── Dashboard segment summary row ── */
.segment-summary {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.seg-badge {
  flex: 1;
  min-width: 140px;
  border-radius: 8px;
  padding: 14px 18px;
  border: 1px solid var(--cream-dark);
}
.seg-badge--high   { background: #f7eaea; border-left: 4px solid #8B3A3A; }
.seg-badge--medium { background: #f5eddf; border-left: 4px solid #8B6F4E; }
.seg-badge--low    { background: #f0eede; border-left: 4px solid #7a7a4a; }
.seg-badge-label {
  display: block;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  margin-bottom: 4px;
  font-weight: 600;
}
.seg-badge-count {
  display: block;
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  color: var(--brown-dark);
}
.seg-badge-rev {
  display: block;
  font-size: 0.82rem;
  color: var(--ink-light);
  margin-top: 2px;
}

/* ── Chart subtitle ── */
.chart-subtitle {
  font-size: 0.78rem;
  color: var(--ink-light);
  margin-bottom: 10px;
  margin-top: -6px;
}

/* ── Table rank cell ── */
.rank-cell {
  color: var(--ink-light);
  font-size: 0.8rem;
  font-weight: 600;
  width: 30px;
}

/* ── Row highlight (best model row) ── */
.row-highlight td {
  background: #f7f0e6;
  font-weight: 500;
}

/* ── Metric hint text ── */
.metric-hint {
  font-size: 0.72rem;
  color: var(--ink-light);
  margin-top: 4px;
  line-height: 1.4;
}

/* ── Prediction result ── */
.predict-result {
  background: var(--white-warm);
  border: 2px solid var(--brown-mid);
  border-radius: var(--radius);
  padding: 32px;
  text-align: center;
  margin-bottom: 24px;
}
.predict-result .clv-label {
  font-size: 0.85rem;
  color: var(--ink-light);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}
.predict-result .clv-amount {
  font-family: 'Playfair Display', serif;
  font-size: 3.2rem;
  color: var(--brown-dark);
  font-weight: 700;
  line-height: 1.1;
}
.clv-range {
  font-size: 0.88rem;
  color: var(--ink-light);
  margin: 10px 0 14px;
}
.ci-note {
  font-size: 0.78rem;
  color: var(--ink-light);
  margin-left: 6px;
}
.clv-segment-row {
  margin-bottom: 14px;
}
.clv-advice {
  font-size: 0.88rem;
  color: var(--ink-light);
  max-width: 540px;
  margin: 0 auto;
  line-height: 1.6;
}

/* ── Prediction form grid ── */
.predict-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}
.field-hint {
  display: block;
  font-size: 0.72rem;
  color: var(--ink-light);
  margin-top: 4px;
}

/* ── RFM Breakdown ── */
.rfm-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.rfm-item {
  border-radius: 8px;
  padding: 18px;
  text-align: center;
  border: 1px solid var(--cream-dark);
}
.rfm-item--good { background: #eaf2e0; border-top: 3px solid #5a7a3a; }
.rfm-item--fair { background: #f5eddf; border-top: 3px solid #8B6F4E; }
.rfm-item--poor { background: #f5e8e8; border-top: 3px solid #8B3A3A; }
.rfm-letter {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--brown-dark);
  line-height: 1;
  margin-bottom: 6px;
}
.rfm-name {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  margin-bottom: 8px;
  font-weight: 600;
}
.rfm-score {
  font-weight: 600;
  font-size: 1.05rem;
  color: var(--brown-dark);
  margin-bottom: 6px;
}
.rfm-desc {
  font-size: 0.78rem;
  color: var(--ink-light);
  line-height: 1.5;
}

/* ── Shared utilities ── */
.section-mb       { margin-bottom: 24px; }
.section-title    { margin-bottom: 16px; }
.metrics-grid--mb { margin-bottom: 24px; }
.chart-card--mb   { margin-bottom: 24px; }
.table-card-header{ padding: 18px 20px 0; }
.empty-row        { text-align: center; color: var(--ink-light); padding: 24px !important; }
.notes-cell       { font-size: 0.8rem; color: var(--ink-light); }
.two-col-grid     { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.info-table       { font-size: 0.82rem; width: 100%; border-collapse: collapse; }
.info-table td    { padding: 5px 0; border: none; }
.info-label       { color: var(--ink-light); padding-right: 12px !important; width: 140px; vertical-align: top; padding-top: 6px !important; }
.action-grid      { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.action-box       { background: var(--cream); border: 1px solid var(--cream-dark); border-radius: 8px; padding: 20px; }
.action-title     { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--brown-dark); margin-bottom: 8px; font-weight: 600; }
.action-desc      { font-size: 0.85rem; color: var(--ink-light); margin-bottom: 16px; line-height: 1.6; }
.steps-grid       { display: grid; grid-template-columns: repeat(3, 1fr); }
.step-box         { padding: 16px; }
.step-box--border { border-right: 1px solid var(--cream-dark); }
.step-number      { font-size: 1.8rem; font-family: 'Playfair Display', serif; color: var(--brown-light); margin-bottom: 8px; }
.step-name        { font-weight: 600; color: var(--brown-dark); margin-bottom: 6px; font-size: 0.95rem; }
.step-desc        { font-size: 0.83rem; color: var(--ink-light); line-height: 1.6; }
.reference-table td { font-size: 0.85rem; }


@media (max-width: 1100px) {
  .kpi-grid { grid-template-columns: repeat(2,1fr); }
  .chart-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-brand">
    <h1>CLV Analytics</h1>
    <p>DVD Rental — Advanced DB</p>
  </div>
  <nav>
    <a href="{% url 'dashboard' %}"  class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <span class="nav-icon">◈</span> Dashboard
    </a>
    <a href="{% url 'etl' %}"        class="nav-link {% if request.resolver_match.url_name == 'etl' %}active{% endif %}">
      <span class="nav-icon">⟳</span> ETL Pipeline
    </a>
    <a href="{% url 'model' %}"      class="nav-link {% if request.resolver_match.url_name == 'model' %}active{% endif %}">
      <span class="nav-icon">◉</span> ML Model
    </a>
    <a href="{% url 'prediction' %}" class="nav-link {% if request.resolver_match.url_name == 'prediction' %}active{% endif %}">
      <span class="nav-icon">◎</span> Predict CLV
    </a>
    <a href="/admin/"                class="nav-link">
      <span class="nav-icon">⊞</span> Admin
    </a>
  </nav>
  <div class="sidebar-footer">
    Customer Lifetime Value Prediction
  </div>
</aside>
<main class="main">
  {% block content %}{% endblock %}
</main>
</body>
</html>
